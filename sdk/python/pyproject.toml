[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-developer-sdk"
version = "1.0.0"
description = "SDK Python officiel pour le contrat OpenAPI de JARVIS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "JARVIS"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_sdk = ["py.typed"]
