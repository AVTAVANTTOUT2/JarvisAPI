[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.worktrees
  | \.venv
  | venv
  | node_modules
  | dist
  | build
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".worktrees",
  ".venv",
  "venv",
  "node_modules",
  "dist",
  "build",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
  "B008", # FastAPI Depends() et File() dans les signatures.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
  "^\\.worktrees/",
  "^venv/",
  "^frontend/",
  "^web/",
  "^pwa/",
]

[tool.bandit]
exclude_dirs = [
  ".worktrees",
  ".venv",
  "venv",
  "node_modules",
  "tests",
]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["api", "database", "jarvis"]
omit = [
  "*/tests/*",
  "jarvis/tests/*",
]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true
precision = 1
