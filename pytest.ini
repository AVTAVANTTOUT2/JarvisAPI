[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Les scripts/test_*.py sont des diagnostics matériels autonomes (macOS,
# capture d'écran, Ollama, pipeline vocal réel), pas des tests pytest. Limiter
# la découverte implicite empêche `pytest` de déclencher ces I/O par surprise.
testpaths =
    tests
    jarvis/tests
    agents/devagent

# La suite standard est hors ligne, déterministe et ne réserve pas le GPU Metal.
# Les scénarios matériels TTS chargent un second modèle si JARVIS tourne déjà ;
# ils restent une porte explicite. Un `-m ...` passé en ligne de commande
# remplace cette valeur (voir README, section « Tests »).
addopts = --strict-markers -m "not external_network and not integration_tts"

markers =
    external_network: nécessite un accès Internet réel vers un service tiers ; exclu de la suite standard, exécuté par `pytest -m external_network`.
    integration_tts: exercice matériel explicite d'un moteur TTS réel (audio réellement produit, aucun mock) ; lancer avec le daemon JARVIS arrêté.
