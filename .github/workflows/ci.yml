name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production_dependencies:
    name: Production dependencies (pip install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/locks/production-linux-x86_64-py312.txt

      - name: Vérifier les locks Python
        run: python tools/update_python_locks.py --check

      - name: Installer les bibliothèques système audio
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev libsndfile1

      - name: Installer toutes les dépendances de production
        run: >-
          python -m pip install --require-hashes
          -r requirements/locks/production-linux-x86_64-py312.txt

      # Audit des CVE des dépendances tierces — c'était le seul angle mort du
      # dépôt (audit sécurité, août 2026). L'audit porte sur l'environnement
      # réellement installé ci-dessus, et non sur une résolution théorique de
      # `requirements.txt` : `pip-audit -r` choisit les versions minimales de
      # chaque plage et signale donc des versions que personne n'installe.
      #
      # Le job est BLOQUANT et n'accepte plus aucune exception connue : le
      # retrait du moteur d'exécution legacy a supprimé les contraintes qui
      # forçaient les versions vulnérables de Starlette, LiteLLM, setuptools
      # et protobuf. Toute CVE détectée fait donc échouer la CI.
      - name: Auditer les CVE des dépendances installées
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off

      - name: Vérifier la cohérence et les imports de production
        run: |
          python -m pip check
          python - <<'EOF'
          import importlib

          modules = [
              "aiohttp",
              "catt",
              "cryptography",
              "faster_whisper",
              "fitz",
              "pyaudio",
              "pvporcupine",
              "sentence_transformers",
              "silero_vad",
              "sounddevice",
              "soundfile",
              "spacy",
              "torch",
              "torchaudio",
          ]
          for module in modules:
              importlib.import_module(module)
          print(f"{len(modules)} dépendances de production importées")
          EOF

  macos_smoke:
    name: macOS 26 (Python + app/widget Release)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/locks/dev-macos-arm64-py312.txt

      - name: Installer les outils et bibliothèques système
        run: brew install xcodegen portaudio libsndfile

      - name: Installer les dépendances Python
        run: >-
          python -m pip install --require-hashes
          -r requirements/locks/dev-macos-arm64-py312.txt

      - name: Vérifier la cohérence des dépendances
        run: python -m pip check

      - name: Smoke tests macOS et contrats Apple simulés
        run: |
          python -m pytest \
            tests/test_macos_runtime.py \
            tests/test_apple_data.py \
            tests/test_calendar_no_foreground.py \
            tests/test_imessage_consumer_cursor.py \
            tests/test_imessage_import.py \
            tests/test_imessage_sourcing.py \
            tests/test_audio_defaults.py \
            tests/test_native_audio_pipeline.py \
            tests/test_local_tts.py \
            tests/test_tts_segmenter.py \
            tests/test_screen_watcher_control.py \
            -q

      - name: Vérifier que le projet Xcode versionné est reproductible
        working-directory: native_mac
        run: |
          xcodegen generate
          git diff --exit-code -- JarvisMac.xcodeproj

      - name: Compiler l'app et le widget en Release sans signature
        working-directory: native_mac
        run: |
          xcodebuild \
            -project JarvisMac.xcodeproj \
            -scheme JarvisMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          test -d build/DerivedData/Build/Products/Release/Jarvis.app
          test -d build/DerivedData/Build/Products/Release/Jarvis.app/Contents/PlugIns/JarvisWidget.appex

  backend:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/locks/ci-linux-x86_64-py312.txt

      - name: Installer les dépendances de test
        # Sous-ensemble léger de requirements.txt : les dépendances lourdes
        # (torch, faster-whisper, pyaudio…) sont optionnelles au runtime —
        # tous les modules dégradent proprement sans elles.
        # `aiohttp` est explicite depuis le retrait d'edge-tts : il n'arrivait
        # ici que comme dépendance transitive de ce paquet, et l'étape d'import
        # de tous les modules en a besoin (scripts/tv_mcp_server.py).
        run: >-
          python -m pip install --require-hashes
          -r requirements/locks/ci-linux-x86_64-py312.txt

      # Même contrat que scripts/local_ci.py (step_lint) : règles pyflakes F
      # uniquement — noms non définis, imports/variables inutilisés. La
      # configuration vit dans .ruff.toml.
      - name: Lint Python (ruff, règles pyflakes)
        run: python -m ruff check .

      - name: Vérifier que tous les modules s'importent
        run: |
          python - <<'EOF'
          import importlib, os, sys
          fails = []
          mods = ["config", "llm", "actions", "supervisor", "main"]
          for root in ["agents", "audio", "database", "integrations", "scripts", "jarvis"]:
              for dirpath, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for f in files:
                      if f.endswith(".py"):
                          m = os.path.join(dirpath, f)[:-3].replace(os.sep, ".")
                          mods.append(m[:-9] if m.endswith(".__init__") else m)
          for m in sorted(set(mods)):
              try:
                  importlib.import_module(m)
              except Exception as e:
                  fails.append(f"{m}: {type(e).__name__}: {e}")
          if fails:
              print("\n".join(fails))
              sys.exit(1)
          print(f"{len(set(mods))} modules importés sans erreur")
          EOF

      - name: Configurer Git pour les dépôts temporaires des tests
        run: |
          git config --global user.name "JarvisAPI CI"
          git config --global user.email "jarvisapi-ci@users.noreply.github.com"

      - name: Vérifier le schéma et la vérité d'architecture générés
        run: >-
          python tools/audit_architecture_truth.py
          --check
          --output artifacts/architecture_truth.json
          --schema-output database/schema.sql
          --status-output Architecture/28_VALIDATION_COHERENCE.md

      - name: Vérifier le contrat OpenAPI public
        run: python tools/export_openapi.py --check

      - name: Vérifier et empaqueter le SDK Python
        run: |
          python tools/generate_python_sdk.py --check
          PYTHONPATH=sdk/python/src python -m pytest sdk/python/tests -q
          python -m pip wheel --no-deps sdk/python --wheel-dir /tmp/jarvis-sdk-wheel

      - name: Vérifier le registre canonique de dette technique
        run: python tools/audit_technical_debt.py --check

      - name: pytest
        run: python -m pytest tests/ jarvis/tests agents/devagent -q

      - name: Tests hors ligne des intégrations découvertes
        run: python tools/run_integration_ci.py --phase offline

      - name: Smoke live hermétique des intégrations découvertes
        run: python tools/run_integration_ci.py --phase live

      - name: Preuve rapide de retrait du provider
        run: >-
          python tools/run_integration_ci.py
          --phase removal
          --quick-removal

      - name: Refuser les erreurs de whitespace Git
        run: git diff --check

  frontend:
    name: Bibliothèque de vues desktop (tests + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Tests unitaires (vitest)
        run: pnpm run test

      - name: Typecheck de la bibliothèque
        run: pnpm run typecheck

  unified_frontend:
    name: Frontend unifié (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installer les dépendances
        run: |
          pnpm --dir ../web install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Installer Chrome pour les tests navigateur
        run: pnpm exec playwright install --with-deps chrome

      - name: Tests, typecheck et build Next.js
        run: pnpm test && pnpm typecheck && pnpm build && pnpm test:e2e

  android:
    # Ce nom est le contexte exigé par la protection de branche `main`.
    # Le renommer casse la fusion de toute PR : GitHub attend indéfiniment un
    # contexte qui ne sera jamais publié. Le job fait bien assemble (debug +
    # release/R8), tests et lint — le nom reste exact.
    name: Android (assemble + tests + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Robolectric télécharge ses images Android instrumentées dans ~/.m2 via
      # MavenArtifactFetcher, hors du cache Gradle. Sans ce cache dédié, une
      # panne Maven transitoire peut faire tomber tous les tests Room ensemble.
      - name: Restaurer les images Android Robolectric
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Activer l’accélération KVM pour l’émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Le build fonctionne sans google-services.json (plugin conditionnel)
      # et produit alors un APK release non signé, suffisant pour valider R8.
      - name: Compiler, tester et linter debug + release
        run: |
          ./gradlew \
            assembleDebug compileDebugUnitTestKotlin lintDebug \
            assembleRelease compileReleaseUnitTestKotlin lintRelease \
            --no-daemon

      - name: Vérifier les artefacts R8 et les DTO conservés
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/mapping/release/mapping.txt
          for dto in \
            fr.jarvis.companion.network.LocationBatchResponse \
            fr.jarvis.companion.network.LocationDiagnosticsResponse \
            fr.jarvis.companion.voice.VoiceTurnResponse
          do
            grep -F "$dto -> $dto:" app/build/outputs/mapping/release/mapping.txt
          done

      - name: Tests instrumentés Android (Keystore + UI)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  removal_proof:
    name: Preuve de retrait complète (sans provider)
    needs: [backend, frontend, unified_frontend, android, macos_smoke]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/locks/dev-macos-arm64-py312.txt

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Installer les outils et dépendances de la preuve
        run: |
          brew install xcodegen portaudio libsndfile
          python -m pip install --require-hashes \
            -r requirements/locks/dev-macos-arm64-py312.txt
          pnpm --dir web install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      - name: Précharger les dépendances Android de façon vérifiée
        working-directory: android
        run: |
          ./gradlew \
            assembleDebug testDebugUnitTest lintDebug \
            assembleRelease testReleaseUnitTest lintRelease \
            --no-daemon

      - name: Retirer le plugin puis rejouer les 16 portes dans la copie
        run: python tools/run_integration_ci.py --phase removal
