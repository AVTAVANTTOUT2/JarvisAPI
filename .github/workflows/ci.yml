name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production_dependencies:
    name: Production dependencies (pip install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les bibliothèques système audio
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev libsndfile1

      - name: Installer toutes les dépendances de production
        run: python -m pip install -r requirements.txt

      # Audit des CVE des dépendances tierces — c'était le seul angle mort du
      # dépôt (audit sécurité, août 2026). L'audit porte sur l'environnement
      # réellement installé ci-dessus, et non sur une résolution théorique de
      # `requirements.txt` : `pip-audit -r` choisit les versions minimales de
      # chaque plage et signale donc des versions que personne n'installe.
      #
      # Le job est BLOQUANT. Les identifiants ci-dessous sont l'arriéré connu
      # au 2026-08-01, chacun tracé à sa cause racine ; toute CVE nouvelle ou
      # sur un autre paquet fait échouer la CI.
      #
      # `open-interpreter==0.4.*` porte à lui seul 18 des 19 exceptions :
      # il plafonne `starlette<0.38.0` et `litellm<2.0.0`, et impose le cap
      # `setuptools<82` (il importe encore `pkg_resources`). Ce plafond
      # starlette écrase aussi FastAPI en 0.115.2. Or l'action publique
      # `terminal` ne lui délègue plus rien (voir CLAUDE.md, « Exécution de
      # code avancée (legacy) ») et `CODE_EXECUTOR_ENABLED=false` par défaut.
      # Le retirer ramènerait l'arriéré de 19 à 7 exceptions — décision
      # produit en attente, voir Architecture/AUDIT_SECURITE_2026-08.md.
      - name: Auditer les CVE des dépendances installées
        run: |
          python -m pip install pip-audit

          # starlette 0.37.2 — plafonné par open-interpreter (<0.38.0)
          known="PYSEC-2026-161 PYSEC-2026-1941 PYSEC-2026-1943"
          known="$known PYSEC-2026-2280 PYSEC-2026-2281"
          known="$known PYSEC-2026-248 PYSEC-2026-249"
          # litellm 1.83.0 — transitif open-interpreter (<2.0.0)
          known="$known PYSEC-2026-388 PYSEC-2026-391"
          known="$known PYSEC-2026-2598 PYSEC-2026-2599 PYSEC-2026-2600"
          known="$known PYSEC-2026-2601 PYSEC-2026-2602"
          known="$known PYSEC-2026-3476 PYSEC-2026-3477 PYSEC-2026-3479"
          # setuptools 81 — cap <82 exigé par pkg_resources (open-interpreter)
          known="$known PYSEC-2026-3447"
          # protobuf 4.25.9 — rétrogradé par la résolution open-interpreter
          known="$known PYSEC-2026-1805"

          ignores=""
          for id in $known; do ignores="$ignores --ignore-vuln $id"; done
          # shellcheck disable=SC2086
          pip-audit --progress-spinner off $ignores

      - name: Vérifier la cohérence et les imports de production
        run: |
          python -m pip check
          python - <<'EOF'
          import importlib

          modules = [
              "aiohttp",
              "catt",
              "cryptography",
              "edge_tts",
              "faster_whisper",
              "fitz",
              "kokoro_onnx",
              "pyaudio",
              "pvporcupine",
              "sentence_transformers",
              "sounddevice",
              "soundfile",
              "spacy",
              "torch",
              "torchaudio",
          ]
          for module in modules:
              importlib.import_module(module)
          print(f"{len(modules)} dépendances de production importées")
          EOF

  macos_smoke:
    name: macOS 14 (Apple contracts)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système audio
        run: brew install portaudio libsndfile

      - name: Installer les dépendances Python
        run: python -m pip install -r requirements-dev.txt

      - name: Vérifier la cohérence des dépendances
        run: python -m pip check

      - name: Smoke tests macOS et contrats Apple simulés
        run: |
          python -m pytest \
            tests/test_macos_runtime.py \
            tests/test_apple_data.py \
            tests/test_calendar_no_foreground.py \
            tests/test_imessage_consumer_cursor.py \
            tests/test_imessage_import.py \
            tests/test_imessage_sourcing.py \
            tests/test_audio_defaults.py \
            tests/test_native_audio_pipeline.py \
            tests/test_no_legacy_audio_provider.py \
            tests/test_screen_watcher_control.py \
            -q

  backend:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances de test
        # Sous-ensemble léger de requirements.txt : les dépendances lourdes
        # (torch, faster-whisper, pyaudio…) sont optionnelles au runtime —
        # tous les modules dégradent proprement sans elles.
        run: |
          pip install \
            "fastapi==0.115.*" "uvicorn[standard]==0.34.*" "python-dotenv==1.2.*" \
            "websockets==15.*" "python-multipart==0.0.*" "jinja2==3.1.*" \
            "httpx==0.28.*" "apscheduler==3.10.*" "pymupdf==1.25.*" \
            "edge-tts==7.*" "Pillow>=10.0" "python-dateutil==2.9.*" \
            "requests>=2.31" "cryptography>=41.0" "numpy>=1.26,<3" \
            "pytest==8.*" "pytest-asyncio>=0.24,<0.27"

      - name: Vérifier que tous les modules s'importent
        run: |
          python - <<'EOF'
          import importlib, os, sys
          fails = []
          mods = ["config", "llm", "actions", "supervisor", "main"]
          for root in ["agents", "audio", "database", "integrations", "scripts", "jarvis"]:
              for dirpath, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for f in files:
                      if f.endswith(".py"):
                          m = os.path.join(dirpath, f)[:-3].replace(os.sep, ".")
                          mods.append(m[:-9] if m.endswith(".__init__") else m)
          for m in sorted(set(mods)):
              try:
                  importlib.import_module(m)
              except Exception as e:
                  fails.append(f"{m}: {type(e).__name__}: {e}")
          if fails:
              print("\n".join(fails))
              sys.exit(1)
          print(f"{len(set(mods))} modules importés sans erreur")
          EOF

      - name: Configurer Git pour les dépôts temporaires des tests
        run: |
          git config --global user.name "JarvisAPI CI"
          git config --global user.email "jarvisapi-ci@users.noreply.github.com"

      - name: pytest
        run: python -m pytest tests/ jarvis/tests agents/devagent -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Tests unitaires (vitest)
        run: pnpm run test

      - name: Typecheck + build Vite
        run: pnpm run build

  unified_frontend:
    name: Frontend unifié (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installer les dépendances
        run: |
          pnpm --dir ../web install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Installer Chrome pour les tests navigateur
        run: pnpm exec playwright install --with-deps chrome

      - name: Tests, typecheck et build Next.js
        run: pnpm test && pnpm typecheck && pnpm build && pnpm test:e2e

  android:
    name: Android (assemble + tests + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Le build fonctionne sans google-services.json (plugin conditionnel)
      # et sans signing.properties (debug uniquement en CI).
      - name: Compiler, tester et linter
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
