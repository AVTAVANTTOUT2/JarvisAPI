name: JarvisMac
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  JarvisMac:
    type: application
    platform: macOS
    sources:
      - path: JarvisMac
        excludes:
          - Resources
    resources:
      - path: JarvisMac/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.desktop
        PRODUCT_NAME: Jarvis
        INFOPLIST_FILE: Config/JarvisMac-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/JarvisMac.entitlements
    dependencies:
      - target: JarvisWidgetExtension
        embed: true
  JarvisWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: JarvisWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.desktop.widget
        PRODUCT_NAME: JarvisWidget
        INFOPLIST_FILE: Config/JarvisWidget-Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  JarvisMac:
    build:
      targets:
        JarvisMac: all
        JarvisWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
