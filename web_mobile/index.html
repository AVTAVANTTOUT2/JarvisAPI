<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>JARVIS</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="apple-touch-icon" href="/mobile/icons/icon-192.png">
<link rel="manifest" href="/mobile/manifest.webmanifest">
<link rel="stylesheet" href="/mobile/app.css?v=20260803">
</head>
<body>

<!-- Jeu d'icônes : quatorze tracés, aucune librairie, aucun octet distant. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <g id="i-chat"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-3.6A7.5 7.5 0 0 1 3 11.5 7.5 7.5 0 0 1 10.5 4h2A7.5 7.5 0 0 1 20 11.5Z"/></g>
    <g id="i-mic"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V22"/></g>
    <g id="i-home"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></g>
    <g id="i-task"><path d="M4 6.5 6 8.5l3.5-3.5M4 16.5l2 2 3.5-3.5M13 7h7M13 17h7"/></g>
    <g id="i-mail"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></g>
    <g id="i-pulse"><path d="M2.5 12h4l2.5-6 4 12 2.5-6h6"/></g>
    <g id="i-send"><path d="M4 12h15M13 6l6 6-6 6"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-check"><path d="M4 12.5 9 17.5 20 6.5"/></g>
    <g id="i-alert"><path d="M12 3.5 22 20H2z"/><path d="M12 10v4M12 16.6v.4"/></g>
    <g id="i-list"><path d="M4 6h16M4 12h16M4 18h11"/></g>
    <g id="i-refresh"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/></g>
    <g id="i-x"><path d="M6 6l12 12M18 6 6 18"/></g>
    <g id="i-back"><path d="M15 5l-7 7 7 7"/></g>
  </defs>
</svg>

<!-- Écran de verrouillage. Occupe tout tant que la session n'est pas confirmée. -->
<div id="lock" class="lock" hidden>
  <p class="lock-mark">Jarvis</p>
  <p id="lock-msg" class="lock-msg"></p>
  <div id="lock-dots" class="lock-dots"></div>
  <div id="lock-keys" class="lock-keys"></div>
  <a class="lock-foot" href="/?desktop=1">Version bureau</a>
</div>

<!-- Application. Jamais rendue avant authentification. -->
<div id="app" class="app" hidden>
  <header id="topbar" class="topbar"></header>
  <div id="banner"></div>
  <main id="view" class="body"></main>
  <div id="dock"></div>
  <nav id="tabs" class="tabs"></nav>
</div>

<script type="module" src="/mobile/js/app.js?v=20260803"></script>
</body>
</html>
